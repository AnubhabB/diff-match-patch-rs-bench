[package]
name = "diff-match-patch-rs-bench"
version = "0.1.0"
edition = "2021"
authors = ["Anubhab Bandyopadhyay"]

[dependencies]
# diff-match-patch-rs = "0" # this crate
# diff-match-patch-rs = { path = "../../temp/diff-match-patch-rs" }
diff-match-patch-rs = { path = "../../diff-match-patch-rs" }
diff_match_patch = "0"
diffmatchpatch = "0"
dmp = "0"
dissimilar = "1"
serde = { version= "1", features= ["derive"] }
serde_derive = "1"
serde_json = "1"

[dev-dependencies]
criterion = "0"
rand = "0.8"


[[bench]]
name = "diff"
harness = false

[[bench]]
name = "patch"
harness = false

[[bench]]
name = "prefix"
harness = false